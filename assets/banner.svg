<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111c35" />
    </linearGradient>

    <!-- Vibrant Branding Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #3b82f6; #10b981" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #3b82f6; #8b5cf6; #06b6d4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #8b5cf6; #ec4899; #6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #ec4899; #10b981; #a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#131d31" />
    </linearGradient>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Effect -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowDashes {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes livePulse {
      0%, 100% { r: 4.5; fill-opacity: 0.9; }
      50% { r: 6.5; fill-opacity: 1; }
    }
    @keyframes barAnim1 {
      0%, 100% { height: 26px; y: 34px; }
      50% { height: 42px; y: 18px; }
    }
    @keyframes barAnim2 {
      0%, 100% { height: 38px; y: 22px; }
      50% { height: 24px; y: 36px; }
    }
    @keyframes barAnim3 {
      0%, 100% { height: 46px; y: 14px; }
      50% { height: 54px; y: 6px; }
    }

    .pulsing-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-box {
      animation: floatCard 7s ease-in-out infinite;
    }
    .pulse-dot {
      animation: livePulse 2s ease-in-out infinite;
    }
    .flowing-arrow {
      stroke-dasharray: 6 5;
      animation: flowDashes 1.8s linear infinite;
    }
    .bar-1 { animation: barAnim1 3.6s ease-in-out infinite; }
    .bar-2 { animation: barAnim2 4.2s ease-in-out infinite; }
    .bar-3 { animation: barAnim3 3.2s ease-in-out infinite; }

    /* Typography */
    .font-heavy {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.8px;
    }
    .font-semibold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
    }
    .font-regular {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Financial Metric Grid Lattice -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="1200" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="110" r="170" fill="url(#glowEmerald)" class="pulsing-glow" />
  <circle cx="980" cy="90" r="180" fill="url(#glowCyan)" class="pulsing-glow" style="animation-delay: -2s;" />
  <circle cx="680" cy="300" r="160" fill="url(#glowPurple)" class="pulsing-glow" style="animation-delay: -4s;" />

  <!-- ==================== LEFT HERO / BRANDING SECTION ==================== -->
  <g transform="translate(56, 46)">
    <!-- Top Micro Badge -->
    <g>
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="14" cy="14" r="4.5" fill="#10b981" class="pulse-dot">
        <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#34d399" class="font-semibold font-mono">ASC 606 &amp; IFRS 15 COMPLIANCE STACK</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" fill="url(#brandGrad)" class="font-heavy" font-size="38">
        Awesome Revenue
      </text>
      <text x="0" y="44" fill="#ffffff" class="font-heavy" font-size="38">
        Recognition Software <tspan fill="#f59e0b">💰</tspan>
      </text>
    </g>

    <!-- Description / Subtitle -->
    <text x="0" y="152" fill="#94a3b8" class="font-regular" font-size="14.5">
      The curated directory of enterprise SaaS revenue platforms,
    </text>
    <text x="0" y="174" fill="#94a3b8" class="font-regular" font-size="14.5">
      deferred waterfalls, SSP allocation &amp; open-source financial ledgers.
    </text>

    <!-- Key Metrics & Feature Pills -->
    <g transform="translate(0, 206)">
      <!-- Pill 1: Commercial SaaS -->
      <g>
        <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#38bdf8" />
        <text x="25" y="20" fill="#f1f5f9" class="font-semibold" font-size="11.5">29+ SaaS Suites</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#10b981" />
        <text x="25" y="20" fill="#f1f5f9" class="font-semibold" font-size="11.5">70+ Open Source</text>
      </g>

      <!-- Pill 3: Double-Entry Ledgers -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="156" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#a855f7" />
        <text x="25" y="20" fill="#f1f5f9" class="font-semibold" font-size="11.5">Double-Entry Ledgers</text>
      </g>
    </g>

    <!-- Secondary Tag Line -->
    <g transform="translate(0, 258)">
      <text x="0" y="12" fill="#64748b" class="font-mono" font-size="10.5">
        NETSUITE · SAP RAR · ZUORA · CHARGEBEE · ERPNEXT · ODOO · OPENBOOKS
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT PIPELINE ARCHITECTURE ==================== -->
  <g class="floating-box" transform="translate(565, 36)" filter="url(#shadow)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="580" height="295" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" />

    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="580" height="36" rx="14" fill="#0b1120" />
    <path d="M 0 24 L 0 36 L 580 36 L 580 24 Z" fill="#0b1120" />
    <line x1="0" y1="36" x2="580" y2="36" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Control Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.9"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.9"/>
    <text x="74" y="22" fill="#94a3b8" class="font-semibold font-mono" font-size="11">REVENUE RECOGNITION ENGINE (ASC 606 / IFRS 15)</text>

    <!-- Pipeline Stages (Horizontal 3-Step) -->
    <!-- Node 1: Contract & Billing Ingestion -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="3.5" fill="#10b981" />
      <text x="26" y="21" fill="#f8fafc" class="font-semibold" font-size="11.5">1. Contract Ingestion</text>
      <text x="12" y="42" fill="#94a3b8" class="font-regular" font-size="10">Subscriptions &amp; Terms</text>
      <text x="12" y="58" fill="#64748b" class="font-regular" font-size="9.5">Multi-tier Invoices, Usage</text>
      <text x="12" y="72" fill="#10b981" class="font-mono" font-size="9">✓ Invoiced &amp; Validated</text>
    </g>

    <!-- Connector Flow 1 -> 2 -->
    <path d="M 170 92 L 205 92" fill="none" stroke="#10b981" stroke-width="2.5" class="flowing-arrow" />
    <polygon points="207,92 201,88 201,96" fill="#10b981" />

    <!-- Node 2: SSP Allocation & POBs -->
    <g transform="translate(210, 52)">
      <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="3.5" fill="#06b6d4" />
      <text x="26" y="21" fill="#f8fafc" class="font-semibold" font-size="11.5">2. POB &amp; SSP Alloc</text>
      <text x="12" y="42" fill="#94a3b8" class="font-regular" font-size="10">Performance Obligations</text>
      <text x="12" y="58" fill="#64748b" class="font-regular" font-size="9.5">Standalone Selling Price</text>
      <text x="12" y="72" fill="#06b6d4" class="font-mono" font-size="9">Catch-Up &amp; Carve-Outs</text>
    </g>

    <!-- Connector Flow 2 -> 3 -->
    <path d="M 370 92 L 405 92" fill="none" stroke="#06b6d4" stroke-width="2.5" class="flowing-arrow" />
    <polygon points="407,92 401,88 401,96" fill="#06b6d4" />

    <!-- Node 3: Rev Waterfall Schedules -->
    <g transform="translate(410, 52)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#nodeGrad)" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="3.5" fill="#8b5cf6" />
      <text x="26" y="21" fill="#f8fafc" class="font-semibold" font-size="11.5">3. Rev Waterfall</text>
      <text x="12" y="42" fill="#94a3b8" class="font-regular" font-size="10">Amortization Engine</text>
      <text x="12" y="58" fill="#64748b" class="font-regular" font-size="9.5">Point-in-Time / Over-Time</text>
      <text x="12" y="72" fill="#8b5cf6" class="font-mono" font-size="9">Daily / Monthly Schedules</text>
    </g>

    <!-- Connector Flow down to GL Posting -->
    <path d="M 290 132 L 290 148" fill="none" stroke="#3b82f6" stroke-width="2.5" class="flowing-arrow" />
    <polygon points="290,150 286,144 294,144" fill="#3b82f6" />

    <!-- Node 4: Automated GL Journal Entries & Double-Entry Posting -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="540" height="128" rx="8" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.2"/>
      
      <!-- GL Header -->
      <g transform="translate(16, 12)">
        <circle cx="6" cy="7" r="4" fill="#3b82f6" class="pulse-dot" />
        <text x="18" y="11" fill="#f8fafc" class="font-semibold" font-size="12">
          Step 4: Automated Double-Entry General Ledger Posting &amp; Audit Trail
        </text>
      </g>

      <!-- Mini Waterfall Dynamic Graphic & Ledger Entries -->
      <g transform="translate(18, 38)">
        <!-- Animated Bar Chart / Waterfall -->
        <g>
          <rect x="0" y="38" width="18" height="20" rx="2" fill="#10b981" opacity="0.85" />
          <rect x="23" y="24" width="18" height="34" rx="2" fill="#06b6d4" opacity="0.85" class="bar-1" />
          <rect x="46" y="16" width="18" height="42" rx="2" fill="#3b82f6" opacity="0.85" class="bar-2" />
          <rect x="69" y="8" width="18" height="50" rx="2" fill="#8b5cf6" opacity="0.85" class="bar-3" />
          <rect x="92" y="20" width="18" height="38" rx="2" fill="#ec4899" opacity="0.85" />
          
          <line x1="-5" y1="58" x2="116" y2="58" stroke="#475569" stroke-width="1" />
          <text x="16" y="70" fill="#64748b" class="font-mono" font-size="8.5">MONTHLY WATERFALL</text>
        </g>

        <!-- Journal Lines (Debit / Credit) -->
        <g transform="translate(132, 2)">
          <rect x="0" y="0" width="374" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="10" y="16" fill="#34d399" class="font-mono" font-size="10">DR</text>
          <text x="36" y="16" fill="#cbd5e1" class="font-mono" font-size="10">Contract Asset (Unbilled AR)</text>
          <text x="240" y="16" fill="#38bdf8" class="font-mono" font-size="10">$120,000.00</text>

          <rect x="0" y="28" width="374" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="10" y="44" fill="#f87171" class="font-mono" font-size="10">CR</text>
          <text x="36" y="44" fill="#cbd5e1" class="font-mono" font-size="10">Deferred Revenue (Liability)</text>
          <text x="240" y="44" fill="#f87171" class="font-mono" font-size="10">$120,000.00</text>

          <rect x="0" y="56" width="374" height="22" rx="4" fill="#090d16" />
          <circle cx="12" cy="67" r="3" fill="#10b981" />
          <text x="22" y="70" fill="#10b981" class="font-mono" font-size="9.5">
            Auto-Sync to NetSuite · SAP · Oracle · ERPNext · Odoo · Ledger
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Glowing Accent Line with moving highlight -->
  <g transform="translate(0, 374)">
    <rect x="0" y="0" width="1200" height="6" fill="url(#brandGrad)" />
    <rect x="0" y="0" width="200" height="6" fill="url(#shimmer)">
      <animate attributeName="x" from="-200" to="1200" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
